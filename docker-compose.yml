version: '3.9'

services:
  # ============ MONGODB DATABASE ============
  mongodb:
    image: mongo:7.0
    container_name: fraudsentinel-mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-fraudadmin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS:-fraudadmin123}
      MONGO_INITDB_DATABASE: fraudsentinel
    ports:
      - "27017:27017"
    volumes:
      # Persist data across container restarts
      - fraudsentinel-mongodb-volume:/data/db
    networks:
      - fraudsentinel-network
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============ SPRING BOOT APPLICATION ============
  fraudsentinel-api:
    image: fraudsentinel:latest
    container_name: fraudsentinel-api
    restart: always
    environment:
      # Spring Boot configuration
      SPRING_APPLICATION_NAME: fraudsentinel
      SPRING_PROFILES_ACTIVE: production

      # MongoDB connection
      SPRING_DATA_MONGODB_URI: mongodb://${MONGO_USER:-fraudadmin}:${MONGO_PASS:-fraudadmin123}@mongodb:27017/fraudsentinel?authSource=admin

      # Server configuration
      SERVER_PORT: 8080
      SERVER_SERVLET_CONTEXT_PATH: /api
    ports:
      - "8080:8080"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - fraudsentinel-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8081/api/health" ]
      interval: 10s
      timeout: 5s
      retries: 3

# ============ VOLUMES ============
volumes:
  fraudsentinel-mongodb-volume:
    driver: local

# ============ NETWORKS ============
networks:
  fraudsentinel-network:
    driver: bridge
