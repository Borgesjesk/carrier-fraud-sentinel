spring.application.name=FraudSentinel
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/fraudsentinel}
spring.data.mongodb.database=fraudsentinel
server.port=8080

# JWT
security.jwt.secret=${SECURITY_JWT_SECRET:bXktdmVyeS1zZWNyZXQta2V5LW11c3QtYmUtYXQtbGVhc3QtMjU2LWJpdHMtbG9uZw==}
security.jwt.expiration-ms=3600000

# CORS
security.cors.allowed-origins=http://localhost:3000,http://localhost:5173

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true