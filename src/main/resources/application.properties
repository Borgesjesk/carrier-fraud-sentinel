spring.application.name=FraudSentinel
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/fraudsentinel}
spring.data.mongodb.database=fraudsentinel
server.port=8080

# JWT ? no default; app refuses to start without explicit secret (intentional)
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-ms=3600000

# Demo user seeding (dev profile only)
app.seed.admin-password=${SEED_ADMIN_PASSWORD:}
app.seed.analyst-password=${SEED_ANALYST_PASSWORD:}
app.seed.compliance-password=${SEED_COMPLIANCE_PASSWORD:}

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true