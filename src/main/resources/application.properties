spring.application.name=FraudSentinel
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/fraudsentinel}
spring.data.mongodb.database=fraudsentinel
server.port=8080

# JWT ? no default; app refuses to start without explicit secret (intentional)
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-ms=3600000

# Demo user seeding (dev profile only)
app.seed.admin-password=${SEED_ADMIN_PASSWORD:}
app.seed.analyst-password=${SEED_ANALYST_PASSWORD:}
app.seed.compliance-password=${SEED_COMPLIANCE_PASSWORD:}

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true

# CORS configuration ? allowed origins for frontend (comma-separated)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:5173}

# Session cookie security (overridden per profile; see application-prod.properties)
app.cookie.name=FS_SESSION
app.cookie.secure=${COOKIE_SECURE:false}
app.cookie.same-site=Strict
app.cookie.max-age-seconds=3600
app.cookie.path=/